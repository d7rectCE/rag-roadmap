[project]
name = "module0-async-fetcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[project.scripts]
module0-async-fetcher = "module0_async_fetcher:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
